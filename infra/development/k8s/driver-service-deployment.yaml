apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-service
  template:
    metadata:
      labels:
        app: driver-service
    spec:
      containers:
        - name: driver-service
          image: ride-sharing/driver-service
          ports:
            - containerPort: 9092
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "128Mi"
              cpu: "125m"
          env:
            - name: AMQP_URL
              valueFrom:
                configMapKeyRef:
                  key: AMQP_URL
                  name: app-config
            - name: POSTGRES_URI
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_URI
                  name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
spec:
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: driver-service
